<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <rect width="900" height="460" rx="10" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="899" height="459" rx="10" fill="none" stroke="#E1E4E8"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#57606A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="34" y="42" font-size="15" font-weight="700" fill="#1B1B1B">LangGraph state machine — one cycle per active journey</text>
  <text x="34" y="64" font-size="12.5" fill="#57606A">Deterministic throughout; the LLM is used only at the final notify step to turn numbers into plain language.</text>

  <!-- data source -->
  <rect x="34" y="96" width="196" height="62" rx="7" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="132" y="120" font-size="12.5" font-weight="600" fill="#1B1B1B" text-anchor="middle">DB Timetables API</text>
  <text x="132" y="139" font-size="11" fill="#57606A" text-anchor="middle">/fchg · live delay + cause code</text>

  <line x1="132" y1="158" x2="132" y2="196" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- monitor -->
  <rect x="34" y="198" width="196" height="70" rx="7" fill="#FFFFFF" stroke="#8B1A31" stroke-width="1.4"/>
  <text x="52" y="222" font-size="10.5" font-weight="700" fill="#8B1A31" letter-spacing="1">01 · MONITOR</text>
  <text x="52" y="243" font-size="12.5" fill="#1B1B1B">Read the live board</text>
  <text x="52" y="259" font-size="11" fill="#57606A">delay = ct − pt</text>

  <line x1="230" y1="233" x2="288" y2="233" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- assess risk -->
  <rect x="290" y="198" width="212" height="70" rx="7" fill="#FFFFFF" stroke="#8B1A31" stroke-width="1.4"/>
  <text x="308" y="222" font-size="10.5" font-weight="700" fill="#8B1A31" letter-spacing="1">02 · ASSESS_RISK</text>
  <text x="308" y="243" font-size="12.5" fill="#1B1B1B">LightGBM quantile model</text>
  <text x="308" y="259" font-size="11" fill="#57606A">q10 / q50 / q90 → p_miss</text>

  <line x1="502" y1="233" x2="556" y2="233" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- decide diamond -->
  <polygon points="628,190 700,233 628,276 556,233" fill="#FFF8E6" stroke="#B5721E" stroke-width="1.4"/>
  <text x="628" y="228" font-size="11.5" font-weight="600" fill="#8A5A17" text-anchor="middle">p_miss ≥ 0.4 ?</text>
  <text x="628" y="245" font-size="10.5" fill="#8A5A17" text-anchor="middle">conditional edge</text>

  <!-- to replan -->
  <path d="M628 190 L628 150 L724 150" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="640" y="143" font-size="10.5" fill="#9E2A20" font-weight="600">yes</text>
  <rect x="726" y="122" width="140" height="56" rx="7" fill="#FDEEEC" stroke="#9E2A20" stroke-width="1.3"/>
  <text x="796" y="146" font-size="12" font-weight="600" fill="#7F1D17" text-anchor="middle">REPLAN</text>
  <text x="796" y="163" font-size="10.5" fill="#7F1D17" text-anchor="middle">check backup legs</text>

  <!-- to wait -->
  <path d="M628 276 L628 316 L724 316" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="640" y="333" font-size="10.5" fill="#2C6B49" font-weight="600">no</text>
  <rect x="726" y="288" width="140" height="56" rx="7" fill="#E9F4EE" stroke="#2C6B49" stroke-width="1.3"/>
  <text x="796" y="312" font-size="12" font-weight="600" fill="#1F5236" text-anchor="middle">WAIT</text>
  <text x="796" y="329" font-size="10.5" fill="#1F5236" text-anchor="middle">keep monitoring</text>

  <!-- notify -->
  <path d="M796 178 L796 200 L640 200 L640 380 L 430 380" fill="none" stroke="#57606A" stroke-width="1.6" opacity="0"/>
  <path d="M726 150 L706 150" fill="none" stroke="#57606A" stroke-width="1.6" opacity="0"/>

  <path d="M796 344 L796 392 L446 392" fill="none" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M866 150 L884 150 L884 392 L446 392" fill="none" stroke="#57606A" stroke-width="1.6"/>

  <rect x="256" y="366" width="188" height="60" rx="7" fill="#FFFFFF" stroke="#8B1A31" stroke-width="1.4"/>
  <text x="274" y="389" font-size="10.5" font-weight="700" fill="#8B1A31" letter-spacing="1">03 · NOTIFY</text>
  <text x="274" y="409" font-size="11.5" fill="#1B1B1B">LLM → plain language</text>

  <!-- loop back -->
  <path d="M256 396 L132 396 L132 268" fill="none" stroke="#57606A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="146" y="352" font-size="10.5" fill="#57606A">scheduler re-invokes (≥30s)</text>
</svg>
